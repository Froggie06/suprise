<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date</title>

    <link rel="stylesheet" href="style.css">
    <style> @import url('https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&family=Chewy&display=swap');</style>

</head>
<body>
    <main>
        <div class="askOnDate">
            <img src="giphy.gif"></img>
            <p>🐼 Will you go on a date with me? 🐼</p>
            <div class="answer-buttons">
                <button class="next">😍 Yes</button>
                <button class="runaway">😳 No</button>
            </div>
            <button class="back" hidden>Back</button>
        </div>

        <div class="confirm">
            <p>Wait you actually said yes? 😭😭</p>
            <p>I was so ready for you to say no</p>
            <button class="next">okay okay! -></button>
            <button class="back">Back</button>
        </div>

        <div class="datePicker">
            <p>So... when are you free?</p>
            <label>Pick a Day
                <input type="date" name="date" min="2026-06-09" required />
            </label>
            
            <label for="time-select">What Time?</label>
            <select required name="time" id="time-select">
                <option value="" disabled selected>Select a time...</option>
                <option value="12">12:00</option>
                <option value="13">13:00</option>
                <option value="14">14:00</option>
                <option value="15">15:00</option>
                <option value="16">16:00</option>
                <option value="17">17:00</option>
                <option value="18">18:00</option>
                <option value="19">19:00</option>
                <option value="20">20:00</option>
                <option value="21">21:00</option>
            </select>

            <button class="next">Set the date</button> 
            <button class="back">Back</button>
        </div>

        <div class="choiceOfDate">
            <p>So what are we feeling?</p>
            <div class="date-options">
                <button class="date-option" data-choice="Italian"><span>🎮</span>Pool or Game night</button>
                <button class="date-option" data-choice="Japanese"><span>🎥</span>Watch a movie</button>
                <button class="date-option" data-choice="Korean"><span>🌅</span>Sunset at the beach</button>
                <button class="date-option" data-choice="Shared Dining"><span>🧃</span>Picknick</button>
                <button class="date-option" data-choice="Drinks with a Bite"><span>🍹</span>Drinks with a bite</button>
                <button class="date-option" data-choice="Greek"><span>🍽️</span>Cooking at home</button>
            </div>

            <button class="next choice-next" disabled hidden>This one -></button>
            <button class="back">Back</button>
        </div>

        <div class="final">
            <p>Glad you didn't say no. Let me know our meeting spot 🫶🏻</p>
            <p>PS. Leuk gemaakt he hihi (ben echt niet geïnspireerd door tiktok hoooor:))</p>
            <p class="submission-status" hidden></p>

        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
